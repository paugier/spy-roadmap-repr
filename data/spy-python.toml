# Pillar: SPy/Python integration. One [table] per node, the table name is the node id.
# Long description (optional): data/descriptions/<id>.md

title = "SPy/Python integration"
order = 6

[python-interop]
title = "Python interop"
kind = "goal"
status = "planned"
summary = "SPy and Python work together in both directions, and exchange arrays without copying. SPy then becomes a better Cython."
depends_on = ["call-python-from-spy", "call-spy-from-python", "array-memoryview"]

[call-python-from-spy]
title = "Call Python from SPy"
kind = "goal"
status = "planned"
summary = "SPy code can import Python modules and call their functions."
depends_on = ["c-integration", "refcounting"]

[call-spy-from-python]
title = "Call SPy from Python (C extensions)"
kind = "goal"
status = "planned"
summary = "SPy modules can be compiled to CPython C extensions and imported from Python."
depends_on = ["py-cffi", "refcounting"]

[py-cffi]
title = "py-cffi output kind"
kind = "feature"
status = "done"
when = "2025-Q2"
summary = "Compile SPy to C, wrap with cffi and import in CPython, for scalars and arrays."

[array-memoryview]
title = "array <-> memoryview / numpy conversion"
kind = "feature"
status = "planned"
summary = "Automatic conversion between SPy arrays and numpy arrays."
depends_on = ["py-cffi", "array-improve"]
