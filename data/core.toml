# Pillar: Core language. One [table] per node, the table name is the node id.
# Long description (optional): data/descriptions/<id>.md

title = "Core language"
order = 1

[perf-interpreter]
title = "Perf interpreter"
kind = "goal"
status = "planned"
summary = "Programs run in the SPy interpreter (before compilation) much faster than today. The way there is to compile the interpreter itself with SPy."
blockers = ["selfhost-interp"]
contributors = ["live-image", "native-stdlib"]

[selfhost-interp]
title = "Self-hosting: compile the SPy interpreter and compiler"
kind = "goal"
status = "planned"
summary = "The SPy interpreter and compiler, written in Python, are themselves compiled by SPy."
blockers = ["python-subset"]

[selfhost-cli]
title = "Self-hosting: compile the SPy CLI"
kind = "goal"
status = "planned"
summary = "The spy command-line tool, written in Python, is compiled by SPy too: the whole toolchain runs without CPython."
blockers = ["selfhost-interp", "python-like-core", "cli-lib", "mod-posix"]

[python-subset]
title = "Compile a large subset of Python"
kind = "goal"
status = "planned"
summary = "SPy compiles most of the Python used by real programs (classes, exceptions, context managers, strings), not only numerical code."
blockers = ["heap-classes", "try-catch", "with-ctx", "str-bytes"]
contributors = ["fstrings", "list-literals", "dict-literals", "tuple", "for-loops", "default-args", "is-op", "pep695", "print-varargs"]

[types-metaprog]
title = "Expressive types and metaprogramming"
kind = "goal"
status = "planned"
summary = "Language features that go beyond Python: protocols, variants (sum types), compile-time metaprogramming."
contributors = ["records", "protocols", "variants", "metaclasses", "advanced-metaprog"]

[blue-args]
title = "Blue-time *args and **kwargs"
kind = "feature"
status = "done"
when = "2026-Q2"
summary = "Variable numbers of arguments handled at compile time (blue time)."

[blue-kwargs]
title = "Blue-time **kwargs"
kind = "feature"
status = "planned"
when = "2026-Q2"
summary = "Variable numbers of arguments handled at compile time (blue time)."


[metaclasses]
title = "Metaclasses in SPy"
kind = "feature"
status = "planned"
summary = "The compiler only knows plain structs. Heap-allocated classes, classes with inheritance, protocols and variants are written in SPy, in the standard library, as metaclasses. The names are proposals."
blockers = ["advanced-metaprog"]

[advanced-metaprog]
title = "Advanced metaprogramming"
kind = "feature"
status = "planned"
summary = "Generate specialized code from a compile-time-known number of arguments: a function that takes any number of typed arguments, and calls that spread them. It is the tool behind helpers such as vectorize, benchmark and partial."
blockers = ["unroll-for-usable", "unroll-splice", "starred-blue", "args-types-red"]
contributors = ["blue-args", "blue-kwargs", "args_m-loc", "args_m-types", "dunder-meta"]

[unroll-splice]
title = "Unroll for splicing"
kind = "feature"
status = "planned"
summary = "Write one expression per element of a compile-time-known range inside a tuple, a call or a subscript, with *(expr for i in unroll_range(n)). The spelling is a proposal."
blockers = ["unroll-for-usable", "starred-blue"]

[starred-blue]
title = "Starred syntax and starred expressions in blue functions"
kind = "feature"
status = "in-progress"
summary = "The parser accepts * in tuples, calls and subscripts, and blue (compile-time) code can use it when all the values are known at compile time."
links = [
  "https://github.com/spylang/spy/pull/710",
]

[args-types-red]
title = "*args: *types in compiled functions"
kind = "feature"
status = "idea"
summary = "A compiled (red) function can take any number of arguments, with their types given by a compile-time tuple: def impl(*args: *types). The spelling is a proposal."
blockers = ["starred-blue"]

[unroll-for]
title = "Unrolled for loops (unroll_range)"
kind = "feature"
status = "done"
when = "2026-Q4"
summary = "A for loop over unroll_range(n), with n known at compile time, is copied n times instead of running as a loop."
links = [
  "https://github.com/spylang/spy/pull/754",
]

[unroll-for-usable]
title = "Unrolled for loops usable"
kind = "feature"
status = "planned"
summary = "unroll_range works, but is not yet usable in real code: the length of the arguments of a metafunction, the length of a tuple and tuples and ranges at compile time still have to be handled as compile-time (blue) values."
blockers = ["unroll-for", "blue-len-args-m", "blue-len-tuple", "blue-struct-tuple-range"]

[blue-len-args-m]
title = "len(args_m) should be blue"
kind = "problem"
status = "planned"
summary = "In a metafunction, len(args_m) is the number of arguments it receives. This number is known at compile time, but the compiler does not yet treat it as a compile-time (blue) value."
links = [
  "https://github.com/spylang/spy/issues/759",
]

[blue-len-tuple]
title = "len(tuple) should be blue"
kind = "problem"
status = "planned"
summary = "The length of a tuple is part of its type. COLOR(len(tup)), with tup a red (run-time) tuple, should be blue (known at compile time), so that it can drive an unrolled loop."
links = [
  "https://github.com/spylang/spy/issues/760",
]

[blue-struct-tuple-range]
title = "Blue structs, tuple, range"
kind = "feature"
status = "planned"
summary = "Structs, tuples and ranges whose content is known at compile time are handled as compile-time (blue) values."
links = [
  "https://github.com/spylang/spy/issues/761",
]

[args_m-types]
title = "args_m.types"
kind = "feature"
status = "idea"
summary = "`args_m` get a attribute `types`."

[args_m-loc]
title = "args_m.loc"
kind = "feature"
status = "idea"
summary = "`args_m` get a attribute `loc`."

[print-varargs]
title = "print() with variable arguments"
kind = "feature"
status = "done"
when = "2026-Q2"
summary = "Needs some macro-like functionality."

[fstrings]
title = "f-strings"
kind = "feature"
status = "done"
when = "2026-Q2"
summary = "Formatted string literals."

[records]
title = "Records"
kind = "feature"
status = "planned"
summary = "Like dataclass but for structs."
blockers = ["metaclasses"]

[protocols]
title = "Protocols"
kind = "feature"
status = "planned"
summary = "Describe the methods a type must provide, so that unrelated classes can be used through one interface, with default method implementations."
blockers = ["metaclasses"]

[variants]
title = "Variants (sum types)"
kind = "feature"
status = "planned"
summary = "A value that is one of several alternatives, each with its own fields, checked by the compiler."
blockers = ["unions", "metaclasses"]

[function-types]
title = "Function types and function values (Callable)"
kind = "feature"
status = "planned"
summary = "Pass a function as an argument and call it at run time, for example a comparison function given to a sort. The spelling Callable[[i32, i32], i32] is a proposal."

[native-stdlib]
title = "PROTOTYPE: interpreter calls compiled stdlib functions"
kind = "task"
status = "in-progress"
summary = "Stdlib modules (starting with random) are compiled ahead of time, and the interpreter calls the compiled functions instead of interpreting them. It is a prototype, not a plan yet."
links = [
  "https://github.com/spylang/spy/pull/755",
]

[live-image]
title = "Serialize the live image after redshifting"
kind = "feature"
status = "planned"
summary = "Save the state of the program after the compile-time phase (redshifting)."

[heap-classes]
title = "Heap-allocated classes"
kind = "feature"
status = "planned"
summary = "Classes whose instances live on the heap and are accessed by reference."
blockers = ["gc-ref", "metaclasses"]

[with-ctx]
title = "with and context managers"
kind = "feature"
status = "planned"
summary = "Support for the with statement."

[try-catch]
title = "try/except"
kind = "feature"
status = "planned"
summary = "Today every raise becomes a panic that stops the program."

[dict-literals]
title = "dict literals"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "Write {k: v} directly in SPy code."
links = [
  "https://github.com/spylang/spy/issues/342",
]

[cli-args]
title = "CLI arguments"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "SPy programs can read command-line arguments."
links = [
  "https://github.com/spylang/spy/issues/353",
]

[tuple]
title = "Compile-time friendly tuple"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "Tuples usable in compile-time computations."
links = [
  "https://github.com/spylang/spy/pull/402",
]

[is-op]
title = "is and is not"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "Identity comparison operators."
links = [
  "https://github.com/spylang/spy/pull/428",
]

[pep695]
title = "PEP 695 syntax for generic functions"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "Python 3.12 generic syntax as sugar for blue generic functions."
links = [
  "https://github.com/spylang/spy/pull/437",
]

[default-args]
title = "Default arguments"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "Functions can have default argument values."
links = [
  "https://github.com/spylang/spy/pull/442",
]

[f32-complex]
title = "f32 and complex types"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "Single-precision floats and complex numbers."
links = [
  "https://github.com/spylang/spy/pull/347",
  "https://github.com/spylang/spy/pull/398",
]

[debugging]
title = "Better debugging (tracebacks, breakpoint)"
kind = "feature"
status = "done"
when = "2025-Q4"
summary = "SPy-level tracebacks and breakpoint()."

[list-literals]
title = "list literals"
kind = "feature"
status = "done"
when = "2025-Q4"
summary = "Write [a, b, c] directly in SPy code."

[for-loops]
title = "for loops, range, iterator protocol"
kind = "feature"
status = "done"
when = "2025-Q3"
summary = "Iteration over ranges and user-defined iterators."

[dunder-meta]
title = "__dunder__ methods and metafunctions"
kind = "feature"
status = "done"
when = "2025-Q3"
summary = "Refactored operator protocol, plus blue-time descriptors."

[errors-checks]
title = "Better error messages and blue/red checks"
kind = "feature"
status = "done"
when = "2025-Q3"
summary = "Proper messages instead of assertion errors; error when a blue function gets red arguments."

[parallelism]
title = "Parallelism"
kind = "goal"
status = "idea"
summary = "SPy programs use several CPU cores."
contributors = ["isolate"]

[isolate]
title = "Isolate"
kind = "feature"
status = "idea"
summary = "A piece of program with its own memory, that can run in parallel with others without sharing mutable data."
