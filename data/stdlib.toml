# Pillar: Standard library. One [table] per node, the table name is the node id.
# Long description (optional): data/descriptions/<id>.md

title = "Standard library"
order = 2

[numspy]
title = "NumSPy"
kind = "goal"
status = "in-progress"
summary = "An implementation of the Python array API standard written in SPy: numpy-like arrays that compile to fast code."
blockers = ["array-improve"]
contributors = ["low-level-programming"]

[python-like-lib]
title = "Python-like lib"
kind = "goal"
status = "planned"
summary = "Third-party libraries with the API a Python user knows (NumSPy for arrays, a Typer/click-like library for command lines...) exist in SPy."
contributors = ["numspy", "cli-lib"]

[python-like-core]
title = "Python-like core"
kind = "goal"
status = "planned"
summary = "The core types and functions a Python user expects (str, bytes, list, dict, array, file I/O) are in SPy and behave as in Python."
contributors = ["str-bytes", "array-improve", "full-io"]

[cli-lib]
title = "Typer/click-like CLI library"
kind = "feature"
status = "idea"
summary = "A library to declare command-line tools (arguments, options, subcommands) from function signatures, with the API of Typer and click."

[python-like-stdlib]
title = "Python-like stdlib"
kind = "goal"
status = "planned"
summary = "The few standard-library modules that matter most to a Python user (math, json, argparse, datetime, posix, socket, sqlite3...) are available in SPy, with the API they know."
contributors = ["python-like-core", "mod-random", "mod-math", "mod-time", "mod-collections", "mod-json", "mod-argparse", "mod-datetime", "mod-re", "mod-pathlib", "mod-subprocess", "mod-posix", "mod-socket", "mod-sqlite3"]

[str-bytes]
title = "str and bytes in pure SPy"
kind = "feature"
status = "planned"
when = "2026-Q2"
summary = "Rewrite the core string types in SPy rather than in the runtime."

[full-io]
title = "Full I/O without ad-hoc builtins"
kind = "feature"
status = "planned"
summary = "Replace special-case builtins with the general C-call mechanism."
blockers = ["c-integration", "file-io"]

# One node per standard-library module. Each contributes to python-like-stdlib.
# Only a short list of the most useful modules that make sense for SPy.
# Modules that wrap a C library are blocked by c-integration.

[mod-random]
title = "random"
kind = "feature"
status = "in-progress"
summary = "Random numbers written in SPy. The module exists but is still very minimal (seed, random, uniform...)."

[mod-math]
title = "math"
kind = "feature"
status = "in-progress"
summary = "Mathematical functions. A first set exists (sqrt, sin, cos, exp, log, pow, floor...); many functions and constants are still missing."

[mod-time]
title = "time"
kind = "feature"
status = "in-progress"
summary = "Clock and delays. Only time() and sleep() exist for now."

[mod-collections]
title = "collections"
kind = "feature"
status = "idea"
summary = "Containers beyond list and dict, such as deque, Counter and defaultdict, written in SPy."

[mod-json]
title = "json"
kind = "feature"
status = "planned"
summary = "Read and write JSON text. Pure SPy, so it needs no C library."

[mod-argparse]
title = "argparse"
kind = "feature"
status = "planned"
summary = "Parse command-line arguments with the argparse API. Pure SPy, so it needs no C library."

[mod-datetime]
title = "datetime"
kind = "feature"
status = "planned"
summary = "Dates, times and durations with the datetime API."

[mod-re]
title = "re"
kind = "feature"
status = "idea"
summary = "Regular expressions. Whether to write the engine in SPy or wrap a C library is still open."

[mod-pathlib]
title = "pathlib"
kind = "feature"
status = "idea"
summary = "Object-oriented file paths. It needs the system calls of posix to read directories and file information."
blockers = ["mod-posix"]

[mod-posix]
title = "posix"
kind = "feature"
status = "planned"
summary = "A posix module that wraps the C system functions (files, processes, environment)."
blockers = ["c-integration"]

[mod-subprocess]
title = "subprocess"
kind = "feature"
status = "idea"
summary = "Start other programs and talk to them through pipes. It needs the process system calls of posix."
blockers = ["mod-posix"]

[mod-socket]
title = "socket"
kind = "feature"
status = "planned"
summary = "A socket module that wraps the C network functions."
blockers = ["c-integration"]

[mod-sqlite3]
title = "sqlite3"
kind = "feature"
status = "planned"
summary = "A sqlite3 module that wraps the SQLite C library."
blockers = ["c-integration"]

[array-improve]
title = "Improve array"
kind = "feature"
status = "planned"
summary = "array is a proof of concept for now, and very limited."
blockers = ["stdlib-foundations"]

[stdlib-foundations]
title = "stdlib directory, list, dict, array"
kind = "feature"
status = "done"
when = "2025-Q3"
summary = "SPy modules importable from stdlib/, with first list, dict and array."

[file-io]
title = "Preliminary file I/O and file object"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "Read and write files."
links = [
  "https://github.com/spylang/spy/pull/447",
]

[builtin-types]
title = "Slices, str.replace, builtin type improvements"
kind = "feature"
status = "done"
when = "2026-Q1"
summary = "More complete builtin types."
links = [
  "https://github.com/spylang/spy/pull/345",
  "https://github.com/spylang/spy/pull/394",
  "https://github.com/spylang/spy/pull/460",
]
