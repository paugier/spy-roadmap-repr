# Pillar: Low-level features. One [table] per node, the table name is the node id.
# Long description (optional): data/descriptions/<id>.md
# Source: the SPy book page "Low-level features SPy still needs" and its page on fixed-size arrays.
# All spellings (InlineArray, @noalias, ll_union...) are proposals.

title = "Low-level features"
order = 4

[perf-compiled]
title = "Perf compiled code"
kind = "goal"
status = "planned"
summary = "Compiled SPy programs run as fast as the C a careful programmer would write."
contributors = ["low-level-programming", "explicit-vectorization", "whippet"]

[low-level-programming]
title = "Low-level programming in SPy"
kind = "goal"
status = "planned"
summary = "Northern star of this pillar: SPy is expressive enough to write numerical kernels, binary-format parsers and wrappers around C libraries, with the control a C programmer expects."
contributors = ["inline-array", "noalias", "layout-control", "unions", "bit-ops", "small-numeric-types", "ptr-to-object", "ptr-to-bounded-array", "raw-free"]

[inline-array]
title = "Fixed-size arrays (InlineArray)"
kind = "feature"
status = "idea"
summary = "Small vectors and matrices (a 3D position, a 3x3 tensor) stored directly inside structs and stack frames, with a length known at compile time."
blockers = ["gc-ref"]

[noalias]
title = "Non-aliasing pointers (@noalias)"
kind = "feature"
status = "idea"
summary = "A decorator promising that some pointer parameters never overlap, so the C compiler can optimize and vectorize loops."

[layout-control]
title = "Layout control (packed, align, offsetof)"
kind = "feature"
status = "idea"
summary = "Choose how struct fields are laid out in memory, for binary file formats, network headers and cache-line alignment."
blockers = ["calc-layout-c-rules", "layout-agree-check", "sizeof-alignof-types", "ptr-size-platform"]

[unions]
title = "Unions (ll_union) and tagged unions"
kind = "feature"
status = "idea"
summary = "Types whose fields share the same bytes: the building block of variants (sum types)."

[bit-ops]
title = "Bit-level operations"
kind = "feature"
status = "idea"
summary = "Read the bits of a float as an integer, and count or rotate bits, each in one CPU instruction."
blockers = ["c-portability"]

[small-numeric-types]
title = "Smaller numeric types (i16, u16, f16, bf16)"
kind = "feature"
status = "idea"
summary = "16-bit integers and half-precision floats, to read audio and image formats and to store large arrays in less memory."

[ptr-to-object]
title = "Pointers to an object"
kind = "feature"
status = "planned"
summary = "A pointer type for a single object, distinct from a pointer to an array. Pointers to an unbounded array already exist."

[ptr-to-bounded-array]
title = "Pointers to a bounded array (fat pointer, span)"
kind = "feature"
status = "planned"
summary = "An address plus a length in every build mode, like a C++ span or a Rust slice, to pass a range of an array to a function. Pointers to an unbounded array already exist."

[raw-free]
title = "Releasing raw memory (raw_free and with)"
kind = "feature"
status = "planned"
summary = "Free manually allocated memory, and guarantee it is released when a block is left."
blockers = ["with-ctx"]

[explicit-vectorization]
title = "Explicit vectorization (SIMD)"
kind = "feature"
status = "in-progress"
summary = "Write numerical kernels with SIMD vectors, which process several numbers per CPU instruction, and run the same kernel on the best vector width of the target machine."
blockers = ["simd-type", "simd-ops", "simd-reductions", "simd-conversions", "simd-width", "simd-march"]
contributors = ["vectorize"]

[vectorize]
title = "vectorize: scalar kernel to SIMD loop"
kind = "feature"
status = "idea"
summary = "A helper that turns a function written for one number into a loop over vectors, with a scalar loop for the remaining elements. The spelling is a proposal."
blockers = ["advanced-metaprog"]

[simd-type]
title = "SIMD type"
kind = "task"
status = "done"
when = "2026-Q4"
summary = "SIMD[T, N], a vector of N numbers of type T, loaded and stored by indexing a pointer to SIMD[T, N]."
links = [
  "https://github.com/spylang/spy/pull/734",
]

[simd-ops]
title = "SIMD arithmetic, comparison, select, iota and element-wise functions"
kind = "task"
status = "in-progress"
summary = "Operators, comparisons, selection by mask and the sequence 0, 1, 2... on SIMD vectors, then min, max, abs, clamp and sqrt."
links = [
  "https://github.com/spylang/spy/pull/742",
  "https://github.com/spylang/spy/pull/743",
]

[simd-reductions]
title = "SIMD reductions and predicates"
kind = "task"
status = "planned"
summary = "Combine the lanes of a vector into one value (sum, min, max, product) and test whether any or all lanes satisfy a condition."

[simd-conversions]
title = "SIMD conversions and float helpers"
kind = "task"
status = "planned"
summary = "Reinterpret the bytes of a vector as another type, convert its numbers (f32 to i32), round, and scale by a power of two."

[simd-width]
title = "Vector width of the target (simd_width_of, --simd-width)"
kind = "task"
status = "in-progress"
summary = "Choose the number of lanes from the width of the vector registers, with a command-line option to override it."
links = [
  "https://github.com/spylang/spy/pull/746",
]

[simd-march]
title = "Target CPU option (--march) and libspy rebuild"
kind = "task"
status = "in-progress"
summary = "Compile for a given CPU instruction set. The runtime library libspy is rebuilt for the same target, because it is optimized together with the generated code."
links = [
  "https://github.com/spylang/spy/pull/745",
]

[c-portability]
title = "C11 and portability macros for generated C"
kind = "task"
status = "idea"
summary = "Move the generated C to C11 and hide every compiler-specific extension behind macros of one libspy header."

[calc-layout-c-rules]
title = "calc_layout follows the C layout rules"
kind = "task"
status = "in-progress"
summary = "Field offsets and struct sizes computed by the compiler follow the same alignment rules as C."
links = [
  "https://github.com/spylang/spy/pull/749",
]

[layout-agree-check]
title = "Check that the interpreter and C layouts agree"
kind = "problem"
status = "idea"
summary = "Nothing verifies that the layout computed by SPy equals the one the C compiler picks, so a mismatch silently corrupts memory."
blockers = ["c-portability"]

[sizeof-alignof-types]
title = "sizeof and alignof for every type"
kind = "bug"
status = "idea"
summary = "sizeof and alignof only know a fixed list of types, and give a wrong alignment for complex128."

[ptr-size-platform]
title = "Size of a pointer depends on the target"
kind = "problem"
status = "idea"
summary = "sizeof assumes the same pointer size everywhere, but it differs between wasm32, native 64-bit and release builds."
